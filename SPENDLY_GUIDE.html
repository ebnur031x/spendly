      concept:'<b>Client-side filtering with derived state</b> — <code class="inline">useMemo</code> chains that recompute the filtered/grouped list only when their actual inputs change, and a simple but effective order-independent search algorithm.',
      connects:['transactions-js','buckets-js'] },
    { id:'bucket-detail-page', path:'src/pages/BucketDetail.jsx', badges:['page'],
      what:'The shared detail screen for Groceries and Bills (parameterized by a <code class="inline">bucketKey</code> prop from the route) — a mini-budget card, an amount+description composer with the bucket-redirect warning system, and a chronological history grouped by date with inline edit/delete.',
      why:'One component serves two routes (<code class="inline">/groceries</code> and <code class="inline">/bills</code>) via a small <code class="inline">CONFIG</code> object keyed by bucket, rather than two nearly-identical page files — Daily Spend and Commitments get their own dedicated pages because their needs diverge enough (day logging, recurrence) to no longer fit this shared shape.',
      concept:'<b>Configuration-driven components</b> — deciding when two similar screens are similar <em>enough</em> to share one implementation (here, via a config object) versus when they should split into separate files (Daily Spend, Commitments) is a real, recurring architecture judgment call.',
      connects:['bucket-redirect-chips','mini-budget-bar','expenses-js','classify-js'] },
    { id:'budget-settings-page', path:'src/pages/BudgetSettings.jsx', badges:['page'],
      what:'Sets a month\'s overall budget by having the user fill in four per-bucket caps (Daily, Groceries, Bills, Commitments); the overall total is never typed directly — it\'s always the live sum of the four inputs, right up until save, when it\'s written as <code class="inline">main_monthly_budget</code> with <code class="inline">budget_mode: \'per_category\'</code>.',
      why:'This is the one screen that actually decides the number every other page measures against (<code class="inline">loadBudgetSnapshot</code>\'s <code class="inline">main</code>) — and deliberately starts every new month blank rather than pre-filling last month\'s numbers, so a budget always reflects an active decision, not stale carryover.',
      concept:'<b>Derived totals in a form</b> — showing a "computed, not directly editable" field (the overall cap) is a small but genuinely useful pattern for preventing the sum and its parts from ever disagreeing.',
      connects:['budgets-js','buckets-js'] },
    { id:'commitments-page', path:'src/pages/Commitments.jsx', badges:['page'],
      what:'Manages the Commitments bucket at <code class="inline">/commitments</code>: this month\'s reserved instances, suggested-but-not-yet-added templates, an add form (name, amount, due date, a "repeats monthly" toggle, color), and a "Recurring" management section to stop a template.',
      why:'The one page where <code class="inline">saveTarget === \'commitments\'</code> is actually reachable (every other composer redirects a "commitments" match to a plain expense in another bucket, since only this screen has the due-date/repeat UI a commitment needs).',
      concept:'<b>The one true home for a data shape</b> — a good illustration of how <code class="inline">useBucketRedirect</code>\'s <code class="inline">saveTarget</code> logic (see the hooks section) actually resolves differently depending on which page it\'s used from.',
      connects:['commitments-js','bucket-redirect-chips','color-swatches'] },
    { id:'daily-deep-dive-page', path:'src/pages/DailyDeepDive.jsx', badges:['page','planning tool'],
      what:'A standalone Daily Spend planning calculator reached from Budget Settings, built around two sections: (1) the month day-by-day as a visual "spine" (weeks collapse by default, expandable to individual days, each with a "Send to Daily Spend" action), and (2) day types with a monthly allocator — set how many days of each type this month, watch the projected total and remaining days-to-allocate update live. Once every day is allocated, the projected total automatically syncs to the real Daily Spend cap in <code class="inline">bucket_settings</code>.',
      why:'This is the most structurally complex single page in the app — it has to keep a hand-drawn timeline UI, a day-type allocator, and a one-way sync into the real budget system all consistent with each other, while staying strictly non-destructive toward already-logged days (see the extensive code comments around bulk-fill and the spine\'s node-positioning math).',
      concept:'<b>Complex derived UI state</b> (the visual "spine" is built from a flat list mixing week-header rows and day rows so React\'s reconciliation never confuses a week key with a day key — a subtlety the code comments call out explicitly as a fixed bug) and a <b>one-directional sync effect</b> that only writes to the real cap once a specific "finalized" condition is met, guarded against re-firing with a ref flag.',
      connects:['daily-deep-dive-js','deep-dive-day-modal','dates-js'] },
    { id:'daily-spend-page', path:'src/pages/DailySpend.jsx', badges:['page','core'],

      why:'Daily Spend is the highest-frequency bucket (the README calls out "today\'s choices, today\'s money"), so this page invests the most in fast entry (presets, quick date-strip navigation) and forgiveness (undo on delete) compared to the other buckets\' simpler composers.',

/* ══════════════════════════════════════════════════════════════════
   RENDER LOGIC
   ══════════════════════════════════════════════════════════════════ */
const FILE_INDEX = {};
CATEGORIES.forEach(cat => cat.files.forEach(f => { FILE_INDEX[f.id] = { ...f, catId: cat.id, catTitle: cat.title }; }));
const FLAT_ORDER = CATEGORIES.flatMap(cat => cat.files.map(f => f.id));

let currentId = null;
let openCats = new Set([CATEGORIES[0].id]);

function iconFor(){ return ''; }

function renderSidebar(filterText){
  const nav = document.getElementById('navScroll');
  nav.innerHTML = '';

  const overviewBtn = document.createElement('button');
  overviewBtn.className = 'nav-overview-btn' + (currentId === null ? ' active' : '');
  overviewBtn.textContent = '◆ Overview & guided tour';
  overviewBtn.onclick = () => { currentId = null; render(); };
  nav.appendChild(overviewBtn);

  const q = (filterText || '').trim().toLowerCase();

  CATEGORIES.forEach((cat, ci) => {
    const files = q
      ? cat.files.filter(f => f.path.toLowerCase().includes(q) || cat.title.toLowerCase().includes(q))
      : cat.files;
    if (q && files.length === 0) return;

    const isOpen = q ? true : openCats.has(cat.id);
    const wrap = document.createElement('div');
    wrap.className = 'cat' + (isOpen ? ' open' : '');

    const head = document.createElement('button');
    head.className = 'cat-head';
    head.innerHTML = `<span class="cat-num">${ci+1}</span><span>${cat.title}</span><span class="cat-chevron">›</span>`;
    head.onclick = () => {
      if (openCats.has(cat.id)) openCats.delete(cat.id); else openCats.add(cat.id);
      renderSidebar(document.getElementById('search').value);
    };
    wrap.appendChild(head);

    const fileList = document.createElement('div');
    fileList.className = 'cat-files';
    files.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'file-btn' + (currentId === f.id ? ' active' : '');
      const base = f.path.split('/').pop();
      btn.innerHTML = `<span class="file-dot"></span><span>${base}</span>`;
      btn.title = f.path;
      btn.onclick = () => { currentId = f.id; render(); };
      fileList.appendChild(btn);
    });
    wrap.appendChild(fileList);
    nav.appendChild(wrap);
  });
}

function chipFor(text){
  const known = FILE_INDEX[text];
  if (known) {
    const base = known.path.split('/').pop();
    return `<button class="chip" data-jump="${text}">${base}</button>`;
  }
  return `<span class="chip plain">${text}</span>`;
}

function renderOverview(){
  const main = document.getElementById('main');
  const totalFiles = FLAT_ORDER.length;
  main.innerHTML = `
    <div class="ov-hero">
      <h1>Spendly — a guided tour of the codebase</h1>
      <p>Spendly is a React 19 + Vite + Tailwind CSS v4 budget tracker for BRAC University students, backed by Supabase (Postgres + auth). Every expense lands in one of four <b>buckets</b> — Daily Spend, Groceries, Bills, Commitments — each with its own history and mini-budget, but all four net against one main monthly budget. This guide walks through every file that makes that work, grouped the way the codebase itself is organized. Click any file on the left, or a category below, to start.</p>
    </div>

    <div class="ov-grid">
      <div class="ov-stat"><div class="num">${totalFiles}</div><div class="lbl">files documented</div></div>
      <div class="ov-stat"><div class="num">${CATEGORIES.length}</div><div class="lbl">categories</div></div>
      <div class="ov-stat"><div class="num">4</div><div class="lbl">expense buckets</div></div>
      <div class="ov-stat"><div class="num">17</div><div class="lbl">database tables (SUPABASE_SETUP.sql)</div></div>
    </div>

    <div class="ov-section">
      <h2><span class="n">1</span>The four buckets — the core idea</h2>
      <p style="color:var(--n500); font-size:14px; line-height:1.7; margin:0 0 14px;">Every screen that logs an expense funnels into exactly one of these. A single main monthly budget (set in <b>Budget Settings</b>) is what all four net against — bucket totals always sum exactly to the overall "spent" figure, enforced by <code class="inline">lib/bucketMath.js</code>.</p>
      <div class="bucket-row">
        <span class="bucket-pill" style="border-color:#22c55e66;color:#22c55e;">☕ Daily Spend</span>
        <span class="bucket-pill" style="border-color:#3b82f666;color:#3b82f6;">🛒 Groceries</span>
        <span class="bucket-pill" style="border-color:#f59e0b66;color:#f59e0b;">🧾 Bills</span>
        <span class="bucket-pill" style="border-color:#a855f766;color:#a855f7;">🏦 Commitments</span>
      </div>
    </div>

    <div class="ov-section">
      <h2><span class="n">2</span>How a request actually flows</h2>
      <div class="flow-box">
<b>index.html</b> loads <b>main.jsx</b>
  <span class="flow-arrow">→</span> mounts <b>App.jsx</b> inside ThemeProvider + ToastProvider
  <span class="flow-arrow">→</span> App.jsx matches the URL to a &lt;Route&gt;
  <span class="flow-arrow">→</span> ProtectedRoute checks AuthContext's session
  <span class="flow-arrow">→</span> the matched <b>page</b> (e.g. Dashboard.jsx) calls a <b>lib/</b> function
  <span class="flow-arrow">→</span> that function queries <b>Supabase</b> (RLS-scoped to auth.uid())
  <span class="flow-arrow">→</span> the page composes <b>components/</b> around the returned data
      </div>
    </div>

    <div class="ov-section">
      <h2><span class="n">3</span>Categories — click to jump in</h2>
      <div class="ov-cat-list" id="ovCatList"></div>
    </div>

    <div class="ov-section">
      <h2><span class="n">4</span>How to read this guide</h2>
      <p style="color:var(--n500); font-size:14px; line-height:1.7;">Every file page has four sections: <b style="color:var(--blue)">What it does</b> (its job in plain language), <b style="color:var(--amber)">Why it matters</b> (what breaks or gets worse without it), <b style="color:var(--purple)">CS concept</b> (the transferable idea it demonstrates — useful for actually defending decisions in this project, not just describing them), and <b style="color:var(--green)">Connects to</b> (clickable links to the other files it depends on or is used by). Use the search box in the sidebar to jump straight to a filename.</p>
    </div>
  `;

  const list = document.getElementById('ovCatList');
  CATEGORIES.forEach((cat, i) => {
    const card = document.createElement('div');
    card.className = 'ov-cat-card';
    card.innerHTML = `<div class="t">${i+1}. ${cat.title}</div><div class="d">${cat.blurb}</div><div class="c">${cat.files.length} file${cat.files.length===1?'':'s'} →</div>`;
    card.onclick = () => {
      openCats.add(cat.id);
      currentId = cat.files[0].id;
      render();
    };
    list.appendChild(card);
  });
}

function renderFile(id){
  const f = FILE_INDEX[id];
  const main = document.getElementById('main');
  if (!f) { renderOverview(); return; }

  const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/') + 1) : '';
  const base = f.path.includes('/') ? f.path.slice(f.path.lastIndexOf('/') + 1) : f.path;

  const idx = FLAT_ORDER.indexOf(id);
  const prevId = idx > 0 ? FLAT_ORDER[idx - 1] : null;
  const nextId = idx < FLAT_ORDER.length - 1 ? FLAT_ORDER[idx + 1] : null;

  main.innerHTML = `
    <div class="crumbs">${f.catTitle} <span style="margin:0 6px;">/</span> <b>${base}</b></div>
    <div class="file-header">
      <div class="file-path"><span class="dir">${dir}</span>${base}</div>
      <div class="badges">${f.badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>
    </div>

    <div class="card what">
      <h3><span class="icon-dot"></span>What it does</h3>
      <p>${f.what}</p>
    </div>
    <div class="card why">
      <h3><span class="icon-dot"></span>Why it matters</h3>
      <p>${f.why}</p>
    </div>
    <div class="card concept">
      <h3><span class="icon-dot"></span>CS concept it demonstrates</h3>
      <p>${f.concept}</p>
    </div>
    <div class="card connects">
      <h3><span class="icon-dot"></span>Connects to</h3>
      ${f.connects && f.connects.length
        ? `<div class="chip-row">${f.connects.map(chipFor).join('')}</div>`
        : `<p style="color:var(--n400); font-style:italic;">No direct file dependencies — a leaf file in the dependency graph.</p>`}
    </div>

    <div class="footer-nav">
      ${prevId ? `<button data-jump="${prevId}"><span class="lbl">← Previous</span>${FILE_INDEX[prevId].path.split('/').pop()}</button>` : '<span></span>'}
      ${nextId ? `<button class="next" data-jump="${nextId}"><span class="lbl">Next →</span>${FILE_INDEX[nextId].path.split('/').pop()}</button>` : '<span></span>'}
    </div>
  `;

  main.querySelectorAll('[data-jump]').forEach(el => {
    el.addEventListener('click', () => { currentId = el.getAttribute('data-jump'); render(); });
  });

  window.scrollTo(0,0);
  main.scrollTop = 0;
}

function render(){
  renderSidebar(document.getElementById('search').value);
  if (currentId === null) renderOverview();
  else renderFile(currentId);
  if (location.hash !== '#' + (currentId || '')) {
    history.replaceState(null, '', currentId ? '#' + currentId : '#');
  }
}

document.getElementById('search').addEventListener('input', (e) => {
  renderSidebar(e.target.value);
});

window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','');
  currentId = h && FILE_INDEX[h] ? h : null;
  render();
});

// initial load
(function init(){
  const h = location.hash.replace('#','');
  currentId = h && FILE_INDEX[h] ? h : null;
  if (currentId) {
    openCats.add(FILE_INDEX[currentId].catId);
  }
  render();
})();
</script>
</body>
</html>
