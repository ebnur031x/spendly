<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spendly — Codebase Guide (Simple Edition)</title>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1c222b; --elevated:#12161d;
    --border:#262c36; --border-2:#30363d; --hairline:#21262d;
    --ink:#e6edf3; --n900:#e6edf3; --n700:#c9d1d9; --n500:#8b949e; --n400:#7d8590; --n300:#636b74;
    --accent:#a78bfa; --accent-2:#7c3aed;
    --green:#3fb950; --blue:#58a6ff; --amber:#e3b341; --red:#f85149; --purple:#a78bfa;
    --code-bg:#0d1117; --code-border:#21262d;
    --shadow: 0 8px 30px rgba(0,0,0,0.35);
    --radius: 14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f7f7fb; --surface:#ffffff; --surface-2:#f2f2f7; --elevated:#ffffff;
      --border:#e6e6ee; --border-2:#dcdce6; --hairline:#ececf2;
      --ink:#14141c; --n900:#14141c; --n700:#33333d; --n500:#5c5c68; --n400:#767682; --n300:#96969f;
      --accent:#7c3aed; --accent-2:#6d28d9;
      --green:#1a7f37; --blue:#0969da; --amber:#9a6700; --red:#cf222e; --purple:#7c3aed;
      --code-bg:#f6f6fb; --code-border:#e6e6ee;
      --shadow: 0 8px 30px rgba(20,20,30,0.08);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1c222b; --elevated:#12161d;
    --border:#262c36; --border-2:#30363d; --hairline:#21262d;
    --ink:#e6edf3; --n900:#e6edf3; --n700:#c9d1d9; --n500:#8b949e; --n400:#7d8590; --n300:#636b74;
    --accent:#a78bfa; --accent-2:#7c3aed;
    --green:#3fb950; --blue:#58a6ff; --amber:#e3b341; --red:#f85149; --purple:#a78bfa;
    --code-bg:#0d1117; --code-border:#21262d;
    --shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --bg:#f7f7fb; --surface:#ffffff; --surface-2:#f2f2f7; --elevated:#ffffff;
    --border:#e6e6ee; --border-2:#dcdce6; --hairline:#ececf2;
    --ink:#14141c; --n900:#14141c; --n700:#33333d; --n500:#5c5c68; --n400:#767682; --n300:#96969f;
    --accent:#7c3aed; --accent-2:#6d28d9;
    --green:#1a7f37; --blue:#0969da; --amber:#9a6700; --red:#cf222e; --purple:#7c3aed;
    --code-bg:#f6f6fb; --code-border:#e6e6ee;
    --shadow: 0 8px 30px rgba(20,20,30,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Inter,system-ui,-apple-system,sans-serif;}
  body{height:100vh;overflow:hidden;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:grid;grid-template-columns:340px 1fr;height:100vh;}
  @media (max-width: 860px){ .app{grid-template-columns:1fr;} }

  /* ── Sidebar (looks like a file tree) ── */
  .sidebar{
    background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .sidebar-head{padding:20px 18px 14px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(145deg,#2c2c2f 0%, #161618 55%, #0b0b0c 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 0 0 1px rgba(124,58,237,0.32);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif; font-style:italic; font-weight:600; font-size:16px;
  }
  .brand-mark span{background:linear-gradient(160deg,#fff 0%,#d2d2d8 55%,#a6a6ae 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .brand-title{font-weight:800; font-size:15px; letter-spacing:-0.02em;}
  .brand-sub{font-size:11.5px; color:var(--n400); margin:2px 0 0; line-height:1.4;}
  .search-box{margin-top:12px;}
  .search-box input{
    width:100%; padding:9px 12px; border-radius:10px; font-size:13px;
    background:var(--surface-2); border:1.5px solid var(--border-2); color:var(--ink); outline:none;
  }
  .search-box input:focus{border-color:var(--accent);}

  .nav-scroll{flex:1; overflow-y:auto; padding:10px 10px 24px;}
  .nav-overview-btn{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:9px 12px; border-radius:10px; font-size:13px; font-weight:700;
    background:transparent; border:none; color:var(--n700); cursor:pointer; margin-bottom:10px;
  }
  .nav-overview-btn:hover{background:var(--surface-2);}
  .nav-overview-btn.active{background:var(--accent); color:#fff;}

  .cat{margin-bottom:2px;}
  .cat-head{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:8px 10px; border-radius:9px; background:transparent; border:none; cursor:pointer;
    color:var(--n700); font-size:13px; font-weight:700; letter-spacing:0.01em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .cat-head:hover{background:var(--surface-2);}
  .cat-folder-icon{font-size:14px; flex-shrink:0;}
  .cat-chevron{margin-left:auto; font-size:10px; color:var(--n400); transition:transform .15s ease; flex-shrink:0; font-family:inherit;}
  .cat.open .cat-chevron{transform:rotate(90deg);}
  .cat-files{max-height:0; overflow:hidden; transition:max-height .2s ease;}
  .cat.open .cat-files{max-height:3000px;}
  .file-btn{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:7px 10px 7px 30px; border-radius:8px; background:transparent; border:none; cursor:pointer;
    color:var(--n500); font-size:12.5px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .file-btn:hover{background:var(--surface-2); color:var(--n900);}
  .file-btn.active{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); font-weight:700;}
  .file-dot{font-size:11px; flex-shrink:0; opacity:0.7;}

  /* ── Main ── */
  .main{height:100vh; overflow-y:auto; padding:38px 48px 100px;}
  @media (max-width: 860px){ .main{padding:24px 20px 80px;} .sidebar{height:auto; max-height:46vh;} .app{grid-template-rows:auto 1fr; height:100vh;} }

  .crumbs{font-size:12px; color:var(--n400); margin-bottom:10px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .crumbs b{color:var(--n700); font-weight:600;}

  .file-header{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
  .file-path{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:22px; font-weight:700;
    letter-spacing:-0.01em; color:var(--n900); word-break:break-all;
  }
  .file-path .dir{color:var(--n400); font-weight:400;}
  .badges{display:flex; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:11px; font-weight:700; padding:5px 11px; border-radius:99px;
    border:1px solid var(--border-2); color:var(--n500); background:var(--surface-2); white-space:nowrap;
  }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card h3{
    margin:0 0 10px; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
    display:flex; align-items:center; gap:9px;
  }
  .card p{margin:0; font-size:15.5px; line-height:1.75; color:var(--n700);}
  .card p + p{margin-top:10px;}
  .card.what h3{color:var(--blue);}
  .card.why h3{color:var(--amber);}
  .card.concept h3{color:var(--purple);}
  .card.connects h3{color:var(--green);}
  .card-emoji{font-size:16px; line-height:1;}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{
    font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:9px;
    background:var(--surface-2); border:1px solid var(--border-2); color:var(--n700);
    cursor:pointer; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent);}
  .chip.plain{cursor:default; font-family:inherit; font-weight:500;}
  .chip.plain:hover{border-color:var(--border-2); color:var(--n700);}

  code.inline{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:0.92em;
    background:var(--code-bg); border:1px solid var(--code-border); border-radius:5px; padding:1px 6px;
    color:var(--accent);
  }

  /* ── Overview page ── */
  .ov-hero{margin-bottom:32px;}
  .ov-hero h1{font-size:32px; font-weight:900; letter-spacing:-0.03em; margin:0 0 10px;}
  .ov-hero p{font-size:16px; color:var(--n500); line-height:1.75; max-width:760px; margin:0;}
  .ov-callout{
    display:flex; align-items:flex-start; gap:14px; background:color-mix(in srgb, var(--accent) 10%, var(--surface));
    border:1.5px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius:14px;
    padding:16px 20px; margin:20px 0 32px; font-size:14.5px; line-height:1.7; color:var(--n700);
  }
  .ov-callout .big{font-size:22px; flex-shrink:0;}
  .ov-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:22px 0 34px;}
  .ov-stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .ov-stat .num{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
  .ov-stat .lbl{font-size:12.5px; color:var(--n400); margin-top:2px;}
  .ov-section{margin-bottom:34px;}
  .ov-section h2{font-size:18px; font-weight:800; letter-spacing:-0.01em; margin:0 0 14px; display:flex; align-items:center; gap:10px;}
  .ov-section h2 .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .flow-box{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 24px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; line-height:2.1; color:var(--n500);
    overflow-x:auto;
  }
  .flow-box b{color:var(--accent); font-weight:700;}
  .flow-arrow{color:var(--n300); margin:0 8px;}
  .ov-cat-list{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px;}
  .ov-cat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
    cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .ov-cat-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .ov-cat-card .t{font-size:13.5px; font-weight:700; margin-bottom:4px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .ov-cat-card .d{font-size:12.5px; color:var(--n400); line-height:1.55;}
  .ov-cat-card .c{font-size:11px; color:var(--n300); margin-top:8px;}

  .bucket-row{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0;}
  .bucket-pill{
    display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:99px;
    font-size:13px; font-weight:700; border:1.5px solid var(--border-2); background:var(--surface);
  }

  .footer-nav{display:flex; justify-content:space-between; margin-top:40px; padding-top:20px; border-top:1px solid var(--border); gap:12px;}
  .footer-nav button{
    background:var(--surface); border:1px solid var(--border-2); color:var(--n700); border-radius:10px;
    padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; max-width:48%; text-align:left;
  }
  .footer-nav button:hover{border-color:var(--accent);}
  .footer-nav button .lbl{display:block; font-size:10.5px; color:var(--n400); font-weight:700; text-transform:uppercase; margin-bottom:2px;}
  .footer-nav .next{text-align:right; margin-left:auto;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark"><span>S</span></span>
        <span class="brand-title">Spendly</span>
      </div>
      <p class="brand-sub">This list is in the SAME ORDER as your file explorer — scroll both side by side!</p>
      <div class="search-box"><input id="search" type="text" placeholder="Search files…" /></div>
    </div>
    <nav class="nav-scroll" id="navScroll"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   DATA — every folder and file, in the EXACT order they appear in the
   project's own file tree (folders A-Z, then files A-Z, top to bottom,
   recursively) — so this guide can be read side-by-side with the real
   file explorer. Every explanation is written simple-and-plain on purpose.
   ══════════════════════════════════════════════════════════════════ */
const CATEGORIES = [
{
  id:'vercel', title:'.vercel/', icon:'📁',
  blurb:'A folder made automatically by the tool that puts Spendly on the internet. You never touch this by hand.',
  files:[
    { id:'vercel-project-json', path:'.vercel/project.json', badges:['auto-made'],
      what:'This is a little sticky note that says "this folder belongs to THIS website on Vercel." Vercel is the company that puts your app on the internet so anyone can visit it.',
      why:'Without this note, when you type a command to put your app online, the computer wouldn\'t know which website is "yours." It\'s basically a name tag for your project.',
      concept:'<b>Linking your computer to a cloud service.</b> Think of it like writing your name on your lunchbox — a tiny file that says "remember me, I belong to Project Spendly," so nobody has to ask every single time.',
      connects:['vercel-json'] },
  ]
},
{
  id:'public', title:'public/', icon:'📁',
  blurb:'Pictures and files that get handed straight to the browser, exactly as they are — nothing changes them.',
  files:[
    { id:'favicon-svg', path:'public/favicon.svg', badges:['picture file'],
      what:'This is the tiny picture that shows up in your browser tab — the little icon next to the page title, like a mini logo sticker.',
      why:'Without it, the browser tab would just show a plain, boring blank-page icon instead of Spendly\'s own little mark.',
      concept:'<b>Public files.</b> Some files aren\'t "cooked" or changed by the computer before use — they\'re handed to the browser exactly as-is, like giving someone a photo instead of a recipe for painting one.',
      connects:['index-html'] },
    { id:'icons-svg', path:'public/icons.svg', badges:['picture file','not used'],
      what:'A picture file sitting in the public folder.',
      why:'Nothing in the app actually uses it right now — like a toy sitting in the closet that nobody plays with anymore.',
      concept:'<b>Not everything you find is being used.</b> Real projects collect a few leftover files over time. Part of learning a project is noticing which pieces are actually working, and which are just sitting there.',
      connects:[] },
  ]
},
{
  id:'src-assets', title:'src/assets/', icon:'📁',
  blurb:'A few picture files inside the src (source code) folder — turns out none of them are actually used by the app anymore.',
  files:[
    { id:'hero-png', path:'src/assets/hero.png', badges:['picture file','not used'],
      what:'A picture file.',
      why:'It\'s not actually shown anywhere in the app right now — the big pretty picture on the homepage is drawn LIVE with code (shapes, colors, animation), not with this saved image.',
      concept:'<b>Leftover files.</b> Same idea as icons.svg — a file that used to matter, or was planned to, but isn\'t hooked up to anything anymore.',
      connects:['landing-page'] },
    { id:'react-svg', path:'src/assets/react.svg', badges:['picture file','not used','starter freebie'],
      what:'The little React logo picture that comes for free when you first start a new React project.',
      why:'It\'s not used anywhere in Spendly — like a sticker that came in the box but never got stuck on anything.',
      concept:'<b>Starter template leftovers.</b> When you begin a project from a template, a few files come along for the ride automatically, and sometimes they just sit there, unused, forever.',
      connects:[] },
    { id:'vite-svg', path:'src/assets/vite.svg', badges:['picture file','not used','starter freebie'],
      what:'The little Vite logo picture — same story as react.svg, just a different free sticker.',
      why:'Also not used anywhere in the app.',
      concept:'<b>Starter template leftovers</b> — see react.svg right above.',
      connects:[] },
  ]
},
{
  id:'src-components', title:'src/components/', icon:'📁',
  blurb:'These are like LEGO bricks — small reusable pieces of screen (a button, a bar, a pop-up) that get snapped together to build the bigger pages.',
  files:[
    { id:'auth-extras', path:'src/components/AuthExtras.jsx', badges:['what you see'],
      what:'Extra decorations for the Sign In and Sign Up pages — floating little bubble stickers, a fancy "remember me" checkbox, and a big green checkmark screen that pops up when you\'re done.',
      why:'Both the Sign In page and the Sign Up page need these exact same decorations, so instead of drawing them twice, they\'re drawn once here and both pages borrow them.',
      concept:'<b>Reusing pieces — like sharing LEGO bricks.</b> Build a piece once, use it in more than one place, instead of building the same thing from scratch twice.',
      connects:['login-page','signup-page'] },
    { id:'bottom-nav', path:'src/components/BottomNav.jsx', badges:['what you see','phone only'],
      what:'The row of buttons stuck to the bottom of your phone screen — Home, Daily, a big plus button in the middle, All, and Savings.',
      why:'On a phone, this is how you move around the whole app with your thumb. Without it, you\'d be stuck on one page with no way to get anywhere else.',
      concept:'<b>Navigation.</b> The app draws a totally different set of buttons for phones than for computers, because thumbs and mouse pointers move differently.',
      connects:['navbar','dashboard-page'] },
    { id:'bucket-card', path:'src/components/BucketCard.jsx', badges:['what you see'],
      what:'One of the four colorful boxes on your home screen — like Daily Spend or Groceries — showing how much you\'ve spent and a couple things you recently bought.',
      why:'It\'s how you glance at how each of your four money "buckets" is doing, without opening each one.',
      concept:'<b>Showing a summary before the details</b> — like the cover of a book that tells you a little about the story before you open it up.',
      connects:['mini-budget-bar','dashboard-page'] },
    { id:'bucket-mismatch-warning', path:'src/components/BucketMismatchWarning.jsx', badges:['what you see'],
      what:'A little yellow note that pops up while you\'re typing, saying "hey, this looks like it belongs somewhere else!"',
      why:'If you type "Electricity bill" into the wrong box, this catches it right away — instead of letting your numbers quietly get mixed up.',
      concept:'<b>Gentle warnings, not locked doors.</b> It tells you something looks off, but still lets you save it if you know better — like a friend saying "are you sure?" instead of grabbing the pencil out of your hand.',
      connects:['classify-js','log-today-modal'] },
    { id:'bucket-picker', path:'src/components/BucketPicker.jsx', badges:['what you see'],
      what:'A row of buttons — Daily, Groceries, Bills — so you can move something you already saved into a different bucket.',
      why:'Sometimes you save something in the wrong bucket by accident. This is the fix-it tool for AFTER it\'s already saved.',
      concept:'<b>Editing after the fact.</b> A different tool for "oops, fix this" than the tool used when you\'re first typing something in.',
      connects:['bucket-redirect-chips','bucket-detail-page','daily-spend-page'] },
    { id:'bucket-redirect-chips', path:'src/components/BucketRedirectChips.jsx', badges:['what you see'],
      what:'Four little pill-shaped buttons — one for each bucket — that show up the second you start typing something new. They tell you which bucket your item is about to go into.',
      why:'This is the app\'s way of never letting you save something in the wrong place without noticing. You always see where it\'s headed before you hit save.',
      concept:'<b>Instant feedback.</b> Showing you the result of what you\'re doing WHILE you\'re still doing it, like a mirror while you\'re getting ready, instead of a photo taken after you already left the house.',
      connects:['use-bucket-redirect','classify-js','daily-spend-page','commitments-page','bucket-detail-page'] },
    { id:'budget-ring', path:'src/components/BudgetRing.jsx', badges:['what you see','drawing'],
      what:'The big circle chart on your home screen that fills up with color to show how much of your budget you\'ve used.',
      why:'It\'s the very first thing you see, and its color (green, yellow, or red) tells you instantly if you\'re doing okay or need to slow down.',
      concept:'<b>Drawing pictures with code.</b> This circle isn\'t a photo — it\'s math and shapes drawn live by the computer (called SVG), the same way you\'d draw a pie chart by hand, except the computer does it.',
      connects:['dashboard-page'] },
    { id:'color-swatches', path:'src/components/ColorSwatches.jsx', badges:['what you see'],
      what:'A row of little colored circles you can tap to pick a color, just like picking a crayon.',
      why:'Used anytime you\'re creating something new (like a Day Type or a Commitment) and need to give it a color.',
      concept:'<b>One tool, many uses.</b> This piece doesn\'t know or care WHAT color it\'s picking for, so it can be reused anywhere a color choice is needed.',
      connects:['day-types-modal','commitments-page'] },
    { id:'day-types-modal', path:'src/components/DayTypesModal.jsx', badges:['what you see','pop-up'],
      what:'A pop-up window where you build your own "day templates," like "Uni Day" — you name it, pick a color, and list the things you usually spend money on that kind of day.',
      why:'This is how logging a busy day becomes fast — instead of typing everything from scratch every time, you build the template once and reuse it.',
      concept:'<b>Templates.</b> Like a coloring page you can print and use over and over, instead of drawing a brand new picture every single time.',
      connects:['day-types-js','log-today-modal','color-swatches'] },
    { id:'deep-dive-day-modal', path:'src/components/DeepDiveDayModal.jsx', badges:['what you see','pop-up'],
      what:'A pop-up for planning or editing exactly what one single day cost, inside the special "what if" planning tool.',
      why:'It lets you play with numbers for a day without it counting as real spending yet — until you choose to send it over to your real budget.',
      concept:'<b>A safe practice space.</b> Like a whiteboard you can scribble and erase on, separate from your "real" notebook, until you decide something\'s ready to copy over for real.',
      connects:['daily-deep-dive-js','daily-deep-dive-page'] },
    { id:'logo', path:'src/components/Logo.jsx', badges:['what you see','branding'],
      what:'The little shiny "S" badge — Spendly\'s logo — with a soft shine that slides across it.',

{
  id:'src-context', title:'src/context/', icon:'📁',
  blurb:'Three "shared memory boxes" — things the WHOLE app needs to know (are you signed in? light or dark mode? any pop-up messages?) that any screen can peek into.',
  files:[
    { id:'auth-context', path:'src/context/AuthContext.jsx', badges:['sign in','shared memory'],
      what:'Keeps track of one thing for the whole app: "is someone signed in right now, and who are they?" Every page can ask this file that question.',
      why:'Instead of every single page separately checking "are you logged in?", they all just ask this one shared helper — so the answer is always the same, everywhere.',
      concept:'<b>Sharing information without passing it hand-to-hand (called Context).</b> Normally you\'d pass information down through a long chain of pieces, like a bucket brigade. Context is a shortcut — any piece can reach up and grab it directly.',
      connects:['supabase-js','protected-route','app-jsx'] },
    { id:'theme-context', path:'src/context/ThemeContext.jsx', badges:['colors','shared memory'],
      what:'Remembers whether the app is in light mode or dark mode, and saves your choice so it\'s still there next time you open the app.',
      why:'This is the actual brain behind the sun/moon button — it flips the switch and remembers what you picked.',
      concept:'<b>Remembering choices between visits.</b> Saving something to the browser\'s own little storage box (called localStorage) so it\'s still true even after you close and reopen the app.',
      connects:['index-html','theme-toggle','index-css'] },
    { id:'toast-context', path:'src/context/ToastContext.jsx', badges:['what you see','shared memory'],
      what:'The little pop-up messages that slide up from the bottom of the screen and disappear on their own — like "Day logged 🎉" or "Deleted — Undo?"',
      why:'Any part of the app can say "show a little message!" and it just works, without that part needing to know how to build a pop-up itself.',
      concept:'<b>A shared announcer.</b> One system in charge of showing quick messages, so lots of different buttons across the app can all use the exact same "pop up and say something" trick.',
      connects:['daily-spend-page','dashboard-page'] },
  ]
},
{
  id:'src-hooks', title:'src/hooks/', icon:'📁',
  blurb:'Small, reusable "tricks" — bits of behavior (not screen pictures) that different pages can borrow.',
  files:[
    { id:'use-bucket-redirect', path:'src/hooks/useBucketRedirect.js', badges:['reusable trick'],
      what:'The little brain behind "which bucket should this go in?" It watches what you\'re typing and keeps a fresh answer ready at every single moment.',
      why:'There used to be a sneaky bug where the app\'s guess could be a tiny bit out of date if you typed and hit save really fast. This file makes sure that can never happen — the answer is worked out fresh every single time, never a stale, saved-from-before answer.',
      concept:'<b>Always calculating the answer fresh, instead of trusting an old one.</b> Like re-adding a list of numbers every time, instead of trusting a total you scribbled down five minutes ago that might already be wrong.',
      connects:['classify-js','bucket-redirect-chips','daily-spend-page'] },
    { id:'use-count-up', path:'src/hooks/useCountUp.js', badges:['reusable trick','movement'],
      what:'Makes a number smoothly climb up (or down) to its real value instead of just snapping to it — like an odometer rolling instead of instantly jumping to a new mile count.',
      why:'Used for the big money numbers on your dashboard, so they feel alive instead of boring and flat.',
      concept:'<b>Animation, frame by frame.</b> The computer redraws the number many times every second, a little closer to the target each time — that\'s literally how ALL smooth animation works, even in video games.',
      connects:['dashboard-page'] },
  ]
},
{
  id:'src-lib', title:'src/lib/', icon:'📁',
  blurb:'The "rulebook" folder. No pictures or buttons in here — just math, rules, and talking to the database. This is the app\'s brain.',
  files:[

      why:'It makes sure the four bucket totals always add up EXACTLY to your total spending — no missing money, no double-counted money.',

      connects:['budget-js'] },
    { id:'buckets-js', path:'src/lib/buckets.js', badges:['the rules','fixed list'],

      connects:['dashboard-page','bucket-detail-page','commitments-page'] },
    { id:'budget-js', path:'src/lib/budget.js', badges:['the rules','saves data'],

      why:'This is the single most important calculation in the whole app. It\'s what the ring, the bucket cards, and the charts ALL read from, so they never disagree with each other.',
      concept:'<b>Gathering everything at once (a snapshot).</b> Instead of asking six separate questions one at a time, it asks all six together, so the answers are guaranteed to match — like a photo, instead of six people describing the room at slightly different moments.',
      connects:['bucket-math-js','dashboard-page','schema-js'] },
    { id:'budgets-js', path:'src/lib/budgets.js', badges:['the rules','saves data'],
      what:'Saves and loads your monthly budget number — the one big number you set for the whole month.',
      why:'This is what actually writes your budget into the database when you save it in Budget Settings.',
      concept:'<b>Save-or-update.</b> Figuring out "does this already exist? Then update it. Doesn\'t exist yet? Then create it" — so you never end up with two budgets for the same month by accident.',
      connects:['budget-settings-page','budget-js'] },
    { id:'categories-js', path:'src/lib/categories.js', badges:['the rules','fixed list'],
      what:'A list of expense categories — Food, Transport, Rent, Gifts — each with its own color and little emoji.',
      why:'Whenever a single purchase needs a cute icon and a color, this is where that comes from.',
      concept:'<b>A lookup list with a safe fallback.</b> If you ask for a category that isn\'t on the list, it doesn\'t break — it just hands back a plain "Other" instead, like a vending machine giving you a default snack instead of jamming.',
      connects:['classify-js','recent-expenses'] },
    { id:'classify-js', path:'src/lib/classify.js', badges:['the rules'],

      why:'This ONE file is the brain behind every single "hey, this looks like it belongs somewhere else" warning in the whole app.',
      concept:'<b>Pattern matching — rule-based guessing.</b> Instead of a super-smart AI, it just checks for keywords, like a checklist: does the word "rent" show up? Then it\'s probably Commitments. Simple rules, and it ALWAYS lets you have the final say.',
      connects:['use-bucket-redirect','bucket-mismatch-warning','bucket-redirect-chips'] },
    { id:'commitments-js', path:'src/lib/commitments.js', badges:['the rules','saves data'],
      what:'Handles things like Rent and Tuition — money you know is coming every month. It keeps a "template" (the plan) separate from each month\'s actual "yes, add this one in" entry.',

      connects:['commitments-page','buckets-js'] },
    { id:'daily-deep-dive-js', path:'src/lib/dailyDeepDive.js', badges:['the rules','saves data'],

      concept:'<b>A sandbox.</b> Like a sandbox at a playground where you can build and knock down castles without it being permanent, with one door (Send to Daily Spend) that lets you carry something out and make it real.',
      connects:['daily-deep-dive-page','daily-logs-js','deep-dive-day-modal'] },
    { id:'daily-logs-js', path:'src/lib/dailyLogs.js', badges:['the rules','saves data'],

      why:'This is what actually gets written to the database when you use "Log Today."',

      connects:['log-today-modal','budget-js'] },
    { id:'dates-js', path:'src/lib/dates.js', badges:['the rules','math helper'],

      why:'Every screen that deals with "this month" or "this week" borrows these same tools, instead of each one figuring out calendar math on its own (which is surprisingly easy to get wrong).',
      concept:'<b>A shared toolbox.</b> Write the tricky math once, test it once, let everyone borrow it — this file even knows that in Bangladesh, weekends are Friday and Saturday, not Saturday and Sunday!',
      connects:['budget-js','daily-deep-dive-js','grocery-deep-dive-js'] },
    { id:'day-types-js', path:'src/lib/dayTypes.js', badges:['the rules','saves data'],
      what:'Manages the "kinds of days" you can log — like Uni Day or Normal Day — including three starter ones every brand-new user gets for free.',
      why:'This is what makes "Log Today" fast — instead of building a day type from scratch, new users already have a few ready to go.',
      concept:'<b>Helpful defaults with an escape hatch.</b> Give new users a good starting point automatically, but remember if they deleted it, so it doesn\'t keep coming back uninvited.',
      connects:['log-today-modal','daily-spend-page','day-types-modal'] },
    { id:'expenses-js', path:'src/lib/expenses.js', badges:['the rules','saves data'],

      why:'It\'s built to be forgiving: if the database is missing one tiny extra piece, it quietly tries again without that piece, instead of just failing to save your ৳150 lunch.',
      concept:'<b>Trying again, smarter.</b> If the first attempt fails for a known reason, try again with one small thing removed, instead of giving up completely.',
      connects:['bucket-detail-page','daily-spend-page','commitments-page'] },
    { id:'format-js', path:'src/lib/format.js', badges:['math helper'],
      what:'Two tiny helpers that turn a plain number into money-looking text, like turning 1234.5 into ৳1,234.50.',
      why:'Every single price shown anywhere in the whole app goes through one of these two functions, so money always looks EXACTLY the same everywhere — never once looking different by accident.',
      concept:'<b>Doing one small job perfectly.</b> This file does exactly one thing, so it\'s easy to trust completely and reuse everywhere.',
      connects:[] },
    { id:'grocery-deep-dive-js', path:'src/lib/groceryDeepDive.js', badges:['the rules','saves data'],
      what:'The data behind the Groceries planning tool — much simpler than the Daily Spend one: just a name, a price, and a date, nothing fancier.',
      why:'Groceries don\'t need "day types" or complicated planning — just logging what you bought works fine, so the code stays simple instead of copying a more complicated pattern just because one exists nearby.',
      concept:'<b>Not over-building things.</b> Using the simplest tool that actually solves the problem, instead of always reaching for the fanciest one just because it exists.',
      connects:['groceries-deep-dive-page','dates-js'] },
    { id:'savings-js', path:'src/lib/savings.js', badges:['the rules','saves data'],
      what:'The simplest file in the whole lib folder — just add, list, edit, and delete savings entries.',
      why:'It\'s the whole engine behind the Savings page, which is its own separate little notebook, not tied into the budget math at all.',
      concept:'<b>The simplest possible pattern (called CRUD): Create, Read, Update, Delete.</b> The four basic things almost every app needs to do with data, shown here in its plainest form.',
      connects:['savings-page'] },
    { id:'schema-js', path:'src/lib/schema.js', badges:['saves data'],
      what:'Carries the ENTIRE database blueprint as one big block of setup code, plus a helper that notices "oh no, the database isn\'t built yet" when something goes wrong.',
      why:'Since the app itself isn\'t allowed to build database tables (that\'s a safety rule), this file is the messenger that shows you the exact building instructions when they\'re needed.',
      concept:'<b>Detecting a specific kind of failure and reacting kindly.</b> Instead of a scary crash, it recognizes "this exact error means the setup step got skipped" and responds with HELP instead of confusion.',
      connects:['supabase-setup-sql','setup-screen'] },
    { id:'supabase-js', path:'src/lib/supabase.js', badges:['saves data','sign in'],
      what:'Sets up the connection to Supabase — the online database and login system this app is built on. Every single save/load anywhere in the app flows through this one connection.',
      why:'It\'s also where "keep me signed in" actually gets decided — whether your login is remembered for 30 days, or forgotten the moment you close the browser.',
      concept:'<b>One shared connection instead of many.</b> Build the doorway to the database exactly once, and have the whole app walk through that same door, instead of every file opening its own separate connection.',
      connects:['env-local','auth-context'] },
    { id:'transactions-js', path:'src/lib/transactions.js', badges:['the rules','saves data'],

      concept:'<b>Looking vs. deciding.</b> Some parts of an app make real decisions with data; other parts are only allowed to look at it and display it nicely. Keeping those separate means a display bug can never mess up your real numbers.',
      connects:['all-transactions-page','bucket-math-js'] },
  ]
},

/* ══════════════════════════════════════════════════════════════════
   RENDER LOGIC
   ══════════════════════════════════════════════════════════════════ */
const FILE_INDEX = {};
CATEGORIES.forEach(cat => cat.files.forEach(f => { FILE_INDEX[f.id] = { ...f, catId: cat.id, catTitle: cat.title }; }));
const FLAT_ORDER = CATEGORIES.flatMap(cat => cat.files.map(f => f.id));

let currentId = null;
let openCats = new Set([CATEGORIES[0].id, CATEGORIES[1].id]);

function renderSidebar(filterText){
  const nav = document.getElementById('navScroll');
  nav.innerHTML = '';

  const overviewBtn = document.createElement('button');
  overviewBtn.className = 'nav-overview-btn' + (currentId === null ? ' active' : '');
  overviewBtn.textContent = '★ Start here (read me first)';
  overviewBtn.onclick = () => { currentId = null; render(); };
  nav.appendChild(overviewBtn);

  const q = (filterText || '').trim().toLowerCase();

  CATEGORIES.forEach((cat) => {
    const files = q
      ? cat.files.filter(f => f.path.toLowerCase().includes(q) || cat.title.toLowerCase().includes(q))
      : cat.files;
    if (q && files.length === 0) return;

    const isOpen = q ? true : openCats.has(cat.id);
    const wrap = document.createElement('div');
    wrap.className = 'cat' + (isOpen ? ' open' : '');

    const head = document.createElement('button');
    head.className = 'cat-head';
    head.innerHTML = `<span class="cat-folder-icon">${cat.icon}</span><span>${cat.title}</span><span class="cat-chevron">›</span>`;
    head.title = cat.blurb;
    head.onclick = () => {
      if (openCats.has(cat.id)) openCats.delete(cat.id); else openCats.add(cat.id);
      renderSidebar(document.getElementById('search').value);
    };
    wrap.appendChild(head);

    const fileList = document.createElement('div');
    fileList.className = 'cat-files';
    files.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'file-btn' + (currentId === f.id ? ' active' : '');
      const base = f.path.split('/').pop();
      btn.innerHTML = `<span class="file-dot">📄</span><span>${base}</span>`;
      btn.title = f.path;
      btn.onclick = () => { currentId = f.id; render(); };
      fileList.appendChild(btn);
    });
    wrap.appendChild(fileList);
    nav.appendChild(wrap);
  });
}

function chipFor(text){
  const known = FILE_INDEX[text];
  if (known) {
    const base = known.path.split('/').pop();
    return `<button class="chip" data-jump="${text}">${base}</button>`;
  }
  return `<span class="chip plain">${text}</span>`;
}

function renderOverview(){
  const main = document.getElementById('main');
  const totalFiles = FLAT_ORDER.length;
  main.innerHTML = `
    <div class="ov-hero">
      <h1>Spendly, explained super simply</h1>
      <p>Spendly is a money-tracking app for students. Every time you buy something, it goes into one of four "buckets" — Daily Spend, Groceries, Bills, or Commitments — kind of like four different jars for four different kinds of spending. This guide walks through EVERY file in the project and explains it like you're five: what it does, why it matters, the big computer idea behind it, and which other files it talks to.</p>
    </div>

    <div class="ov-callout">
      <span class="big">🗂️</span>
      <div>
        <b>This guide is in the SAME ORDER as your file explorer.</b> Open your project folder in one window and this guide in another. The sidebar on the left goes folder-by-folder, top to bottom, A-to-Z inside each folder — exactly the way VS Code (or Windows Explorer) shows it. So as you scroll down the sidebar here, you can scroll down your real file list at the same speed and they'll always match up.
      </div>
    </div>

    <div class="ov-grid">
      <div class="ov-stat"><div class="num">${totalFiles}</div><div class="lbl">files explained</div></div>
      <div class="ov-stat"><div class="num">${CATEGORIES.length}</div><div class="lbl">folders (in tree order)</div></div>
      <div class="ov-stat"><div class="num">4</div><div class="lbl">money "buckets"</div></div>
      <div class="ov-stat"><div class="num">17</div><div class="lbl">database tables</div></div>
    </div>

    <div class="ov-section">
      <h2><span class="n">1</span>The big idea: four buckets</h2>
      <p style="color:var(--n500); font-size:14.5px; line-height:1.75; margin:0 0 14px;">Imagine four jars on a shelf. Every time you spend money, it goes in one jar. All four jars still share ONE big budget for the whole month — the app just makes sure you always know which jar a purchase landed in, so nothing gets mixed up.</p>
      <div class="bucket-row">
        <span class="bucket-pill" style="border-color:#22c55e66;color:#22c55e;">☕ Daily Spend</span>
        <span class="bucket-pill" style="border-color:#3b82f666;color:#3b82f6;">🛒 Groceries</span>
        <span class="bucket-pill" style="border-color:#f59e0b66;color:#f59e0b;">🧾 Bills</span>
        <span class="bucket-pill" style="border-color:#a855f766;color:#a855f7;">🏦 Commitments</span>
      </div>
    </div>

    <div class="ov-section">
      <h2><span class="n">2</span>How the pieces talk to each other</h2>
      <div class="flow-box">
<b>index.html</b> opens the app
  <span class="flow-arrow">→</span> <b>main.jsx</b> turns everything on
  <span class="flow-arrow">→</span> <b>App.jsx</b> looks at the web address and picks a page
  <span class="flow-arrow">→</span> a guard checks "are you signed in?"
  <span class="flow-arrow">→</span> that <b>page</b> asks a <b>lib/</b> file for numbers
  <span class="flow-arrow">→</span> that file asks the <b>database</b> (only for YOUR data)
  <span class="flow-arrow">→</span> the page draws the answer using <b>components/</b>
      </div>
    </div>

    <div class="ov-section">
      <h2><span class="n">3</span>Pick a folder to open (same order as your explorer)</h2>
      <div class="ov-cat-list" id="ovCatList"></div>
    </div>

    <div class="ov-section">
      <h2><span class="n">4</span>How to read each file's page</h2>
      <p style="color:var(--n500); font-size:14.5px; line-height:1.75;">Every file gets four simple boxes: <b style="color:var(--blue)">What it does</b> (in plain words), <b style="color:var(--amber)">Why it matters</b> (what would break without it), <b style="color:var(--purple)">The big idea</b> (the real computer-science concept behind it, explained with an everyday example — so you can actually explain and defend how this project works, not just point at it), and <b style="color:var(--green)">Talks to</b> (click these to hop straight to the other files it depends on).</p>
    </div>
  `;

  const list = document.getElementById('ovCatList');
  CATEGORIES.forEach((cat) => {
    const card = document.createElement('div');
    card.className = 'ov-cat-card';
    card.innerHTML = `<div class="t">${cat.icon} ${cat.title}</div><div class="d">${cat.blurb}</div><div class="c">${cat.files.length} file${cat.files.length===1?'':'s'} →</div>`;
    card.onclick = () => {
      openCats.add(cat.id);
      currentId = cat.files[0].id;
      render();
    };
    list.appendChild(card);
  });
}

function renderFile(id){
  const f = FILE_INDEX[id];
  const main = document.getElementById('main');
  if (!f) { renderOverview(); return; }

  const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/') + 1) : '';
  const base = f.path.includes('/') ? f.path.slice(f.path.lastIndexOf('/') + 1) : f.path;

  const idx = FLAT_ORDER.indexOf(id);
  const prevId = idx > 0 ? FLAT_ORDER[idx - 1] : null;
  const nextId = idx < FLAT_ORDER.length - 1 ? FLAT_ORDER[idx + 1] : null;

  main.innerHTML = `
    <div class="crumbs">${f.catTitle} <span style="margin:0 6px;">/</span> <b>${base}</b></div>
    <div class="file-header">
      <div class="file-path"><span class="dir">${dir}</span>${base}</div>
      <div class="badges">${f.badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>
    </div>

    <div class="card what">
      <h3><span class="card-emoji">🧩</span>What it does</h3>
      <p>${f.what}</p>
    </div>
    <div class="card why">
      <h3><span class="card-emoji">💡</span>Why it matters</h3>
      <p>${f.why}</p>
    </div>
    <div class="card concept">
      <h3><span class="card-emoji">🎓</span>The big idea (a real CS concept, explained simply)</h3>
      <p>${f.concept}</p>
    </div>
    <div class="card connects">
      <h3><span class="card-emoji">🔗</span>Talks to</h3>
      ${f.connects && f.connects.length
        ? `<div class="chip-row">${f.connects.map(chipFor).join('')}</div>`
        : `<p style="color:var(--n400); font-style:italic;">Nothing else — this file stands alone.</p>`}
    </div>

    <div class="footer-nav">
      ${prevId ? `<button data-jump="${prevId}"><span class="lbl">← Previous in the tree</span>${FILE_INDEX[prevId].path}</button>` : '<span></span>'}
      ${nextId ? `<button class="next" data-jump="${nextId}"><span class="lbl">Next in the tree →</span>${FILE_INDEX[nextId].path}</button>` : '<span></span>'}
    </div>
  `;

  main.querySelectorAll('[data-jump]').forEach(el => {
    el.addEventListener('click', () => { currentId = el.getAttribute('data-jump'); render(); });
  });

  window.scrollTo(0,0);
  main.scrollTop = 0;
}

function render(){
  renderSidebar(document.getElementById('search').value);
  if (currentId === null) renderOverview();
  else renderFile(currentId);
  if (location.hash !== '#' + (currentId || '')) {
    history.replaceState(null, '', currentId ? '#' + currentId : '#');
  }
}

document.getElementById('search').addEventListener('input', (e) => {
  renderSidebar(e.target.value);
});

window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','');
  currentId = h && FILE_INDEX[h] ? h : null;
  render();
});

// initial load
(function init(){
  const h = location.hash.replace('#','');
  currentId = h && FILE_INDEX[h] ? h : null;
  if (currentId) {
    openCats.add(FILE_INDEX[currentId].catId);
  }
  render();
})();
</script>
